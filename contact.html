<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — EDERITO</title><link rel="stylesheet" href="styles.css?v=6"></head><body data-page="contact"><header id="siteHeader"></header><main><section class="page-intro shell"><span class="micro">CONTACT</span><h1>Tell me what you need.</h1><p>Send a project request or email contact@ederito.com.</p></section><section class="shell contact-layout"><div><h2>Start a project.</h2><p class="muted">Share your business, service, and project details.</p></div><form class="form" id="contactForm"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Business</label><input name="business"></div><div class="field"><label>Service</label><select name="service" required><option value="">Choose one</option><option>Logo</option><option>Website</option><option>Shopify</option><option>App</option><option>LLC filing assistance</option><option>Custom project</option></select></div><div class="field"><label>Budget</label><input name="budget"></div><div class="field"><label>Project details</label><textarea name="details" required></textarea></div><div class="honeypot"><input name="website" tabindex="-1"></div><button class="button dark" type="submit">Send request</button><p id="contactStatus" class="form-status"></p></form></section></main><footer id="siteFooter"></footer><script src="script.js?v=6" defer></script></body></html>
